server {
  listen 80;
  root /usr/share/nginx/html;

  # The Plotly chunk is about 4.6 MB raw; compress text assets (it comes to ~1.4 MB).
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  # Docker's embedded DNS. Looking the API up per request (through the variable below), rather
  # than once at startup, lets nginx start while the API is down and follow it when it is
  # recreated with a new IP address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;

  location /api/ {
    set $api_upstream http://backend:8000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    # Fail fast when the API is unreachable instead of holding the request for the default
    # 60 s; the dashboard shows an error with a retry button.
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  # Vite names built assets after their content, so they can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The entry page names the current assets, so it must always be revalidated.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Single-page app: unknown paths fall back to index.html.
  location / {
    try_files $uri /index.html;
  }
}
